site_name: DataU
site_description: User & developer documentation for the DataU platform and SPOON tools.
site_url: https://cosminularu.github.io/public-docs/
site_author: Jibe Company

theme:
  name: material
  icon:
    logo: material/shield-account
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - getting-started.md
      - User Guide (Data Subject):
          - DashboardU User Guide: data-subjects/dashboardu.md
      - Developer Guide (Data Processor):
          - developers/index.md
          - ProxyU Client Guide:
              - developers/proxyu-java-sdk/index.md
              - Getting Started: developers/proxyu-java-sdk/getting-started.md
              - SDK Capabilities: developers/proxyu-java-sdk/capabilities.md
              - Demo Application: developers/proxyu-java-sdk/demo-app.md
              - Troubleshooting: developers/proxyu-java-sdk/troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CosminUlaru/public-docs

copyright: © Jibe Company BV
