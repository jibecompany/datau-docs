site_name: DataU
site_description: User & developer documentation for the DataU platform and SPOON tools.
site_url: https://cosminularu.github.io/public-docs/
site_author: Jibe Company

theme:
  name: material
  custom_dir: overrides
  logo: assets/datau-logo.png
  favicon: assets/datau-icon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started.md
      - User Guide (Data Subject):
          - DashboardU User Guide: data-subjects/dashboardu.md
      - Connected Apps:
          - connected-apps/index.md
          - SPOON Project:
              - connected-apps/spoon/index.md
              - SPOON Dashboard: connected-apps/spoon/spoon-dashboard.md
              - Questionnaire Tool: connected-apps/spoon/questionnaire-tool.md
              - Data Lake: connected-apps/spoon/data-lake.md
              - Personal Data Wallet: connected-apps/spoon/personal-data-wallet.md
      - Developer Guide (Data Processor):
          - data-processors/index.md
          - ProxyU Client Guide:
              - data-processors/proxyu-java-sdk/index.md
              - Getting Started: data-processors/proxyu-java-sdk/getting-started.md
              - SDK Capabilities: data-processors/proxyu-java-sdk/capabilities.md
              - Demo Application: data-processors/proxyu-java-sdk/demo-app.md
              - Troubleshooting: data-processors/proxyu-java-sdk/troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CosminUlaru/public-docs

copyright: © Jibe Company BV
