site_name: DataU Docs
site_description: User & Developer documentation for the DataU platform.
site_url: https://jibecompany.github.io/datau-docs/
site_author: Jibe Company

theme:
  name: material
  custom_dir: overrides
  logo: assets/datau-logo.png
  favicon: assets/datau-icon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started.md
      - User Guide (Data Subject):
          - DashboardU User Guide: data-subjects/dashboardu.md
      - Developer Guide (Data Processor):
          - data-processors/index.md
          - ProxyU Java Client:
              - data-processors/java-client/index.md
              - Demo Application: data-processors/demo-app.md
              # Archived SDK releases — newest first. See CLAUDE.md "Versioning the Java client docs".
              - Previous versions:
                  - "SDK 1.1.0": data-processors/java-client/v1.1.0.md
          - ProxyU Go Client: data-processors/go-client.md
          - Didn't find your language?:
              - data-processors/other-languages/index.md
              - Integration Protocol: data-processors/proxyu-integration.md
          - Troubleshooting: data-processors/troubleshooting.md
      - Connected Apps:
          - connected-apps/index.md
          - SPOON Project:
              - connected-apps/spoon/index.md
              - SPOON Dashboard: connected-apps/spoon/spoon-dashboard.md
              - Questionnaire Tool: connected-apps/spoon/questionnaire-tool.md
              - Personal Data Wallet: connected-apps/spoon/personal-data-wallet.md
              - Data Lake: connected-apps/spoon/data-lake.md

