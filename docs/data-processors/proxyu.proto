syntax = "proto3";

// This file deliberately declares no language package option, so generated code lands in a
// neutral package derived from `package protocol;` below. Add the option for your language if
// you want your own namespace:
//
//   Java    option java_package = "com.yourcompany.proxyu.protocol";
//   Go      option go_package = "github.com/yourcompany/proxyu/protocol";   // protoc-gen-go requires this
//   C#      option csharp_namespace = "YourCompany.ProxyU.Protocol";
//   PHP     option php_namespace = "YourCompany\\ProxyU\\Protocol";
//
// Python, Ruby and JavaScript take no package option. Option names are fixed by protobuf and
// validated by protoc, so only the documented FileOptions names are accepted.
package protocol;

service ProxyUIntegration {
    rpc Correlation (CorrelationRequest) returns (stream CorrelationResponse);
    rpc SubmitDocument (SubmitDocumentRequest) returns (SubmitDocumentResponse);
    rpc Permission (PermissionRequest) returns (stream PermissionResponse);
    rpc Data (stream DataRequest) returns (stream DataResponse);

    rpc GetDataIdentificationGraph(DataIDGraphRequest) returns (DataIDGraphResponse);
}

message CorrelationRequest {}

message CorrelationResponse {
    oneof response {
        string correlation_message = 1;
        CorrelationResult correlation_result = 2;
    }
}

message CorrelationResult {
    string correlation_message = 1;
    bytes public_key = 2; // 32 bytes ed25519 public key
}

message SubmitDocumentRequest {
    string url = 1;
    bytes hash = 2; // 32 bytes SHA3-256 hash
}

message SubmitDocumentResponse {
    bool ok = 1;
    string error = 2;
}

message PermissionRequest {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
    bytes reason = 4; // 16 bytes UUIDv4
    bytes policy = 5; // 32 bytes SHA3-256 hash
    uint64 from = 6; // Unix UTC timestamp
    uint64 until = 7; // Unix UTC timestamp
    uint32 amount = 8;
    uint32 level = 9;
    uint32 reward_points = 10;
}

message PermissionResponse {
    oneof response {
        string permission_message = 1;
        PermissionResult permission_result = 2;
    }
}

message PermissionResult {
    string permission_message = 1;
    bool granted = 2;
}

message DataField {
    bytes uuid = 1; // 16 bytes UUIDv4
    bytes value = 2;
    string mime = 3;
    bytes filename = 4; // name of transferred file; used only in bulk data transfer flow
}

message DataRetrieveRequest {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
}

message DataRetrieveResponse {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
    sint32 error = 4;
    repeated DataField fields = 5;
}

message DataSupplyRequest {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
    bytes value = 4;
    string mime = 5;
    bytes filename = 6; // name of transferred file; used only in bulk data transfer flow
}

message DataSupplyResponse {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
    sint32 error = 4;
}

message DataDeleteRequest {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
}

message DataDeleteResponse {
    bytes public_key = 1; // 32 bytes ed25519 public key
    bytes data = 2; // 16 bytes UUIDv4
    bytes process = 3; // 16 bytes UUIDv4
    sint32 error = 4;
}

message DataNopRequest {}

message DataRequest {
    oneof request {
        DataRetrieveRequest retrieve_request = 1;
        DataRetrieveResponse retrieve_response = 2;
        DataSupplyResponse supply_response = 3;
        DataDeleteResponse delete_response = 4;
        DataNopRequest nop_request = 5;
    }
}

message DataResponse {
    oneof response {
        DataRetrieveRequest retrieve_request = 1;
        DataRetrieveResponse retrieve_response = 2;
        DataSupplyRequest supply_request = 3;
        DataDeleteRequest delete_request = 4;
    }
}

// DataIDNode is a single node in the data identification directed acyclic graph
message DataIDGraphNode {
    bytes key = 1; // 16-byte UUIDv4
    string description = 2; // Human-readable description
    string mime = 3; // MIME type of this field
    repeated DataIDGraphNode children = 4; // Children of this node
}

message DataIDGraphRequest {};

// DataIDGraphResponse contains a list of all the root nodes of the DAG, through which you can traverse the
// tree through their children.
message DataIDGraphResponse {
    repeated DataIDGraphNode nodes = 1; // All root nodes of the DAG
}
